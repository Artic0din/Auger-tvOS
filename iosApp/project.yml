name: Auger
options:
  bundleIdPrefix: com.artic0din.auger
  deploymentTarget:
    tvOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: en
  generateEmptyDirectories: true

settings:
  configs:
    Debug:
      # Required for `@testable import Auger` (and module-aliased `Silo`) in
      # AugerTests; Xcode's Debug template sets these defaults but XcodeGen
      # does not.
      ENABLE_TESTABILITY: "YES"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG"
  base:
    SWIFT_VERSION: "5"
    # String catalogs use manual entries so Xcode generates
    # LocalizedStringResource symbols (`common.cancel` -> `.commonCancel`)
    # without extracting Swift literals into the catalogs.
    STRING_CATALOG_GENERATE_SYMBOLS: "YES"
    SWIFT_EMIT_LOC_STRINGS: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: false
    # DEVELOPMENT_TEAM is intentionally omitted — set via the DEVELOPMENT_TEAM env var locally
    # or injected by the CI pipeline.
    CODE_SIGN_STYLE: Automatic
    # Media/image packages ship arm64 simulator slices. Exclude x86_64 for the
    # tvOS simulator SDK so Apple Silicon Macs don't try to link missing slices.
    EXCLUDED_ARCHS[sdk=appletvsimulator*]: x86_64

# One committed version/channel baseline for every shippable target: the app
# and its embedded Top Shelf extension must ship the same CFBundleVersion.
#
# This is a target template, NOT the project-level `settings.base`, so a stray
# MARKETING_VERSION in a gitignored Local.xcconfig cannot silently outrank the
# committed value. CI still outranks everything via xcodebuild xcargs.
targetTemplates:
  ShippableProduct:
    settings:
      base:
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: 1
        # Surfaced to the app as the `SiloBuildChannel` Info.plist key and
        # reported to the Silo server as X-Silo-Client-Channel. The unsigned
        # sideload lane overrides this to `sideload`; DEBUG builds report
        # `dev` regardless.
        SILO_BUILD_CHANNEL: release
        # The published source archive for this build, surfaced as the
        # `SiloSourceURL` Info.plist key behind Settings > About > Source
        # Code. Release lanes set it from SILO_RELEASE_SOURCE_URL; empty
        # builds link the repository instead.
        SILO_SOURCE_URL: ""

packages:
  # The media engine used for playback. Keep this at an exact reviewed
  # revision; Package.resolved also freezes its binary dependencies.
  AetherEngine:
    url: https://github.com/Silo-Server/AetherEngine
    revision: f470d8dc610537929c83ef31877287e9d2ad9d28
  SwiftAssRenderer:
    url: https://github.com/mihai8804858/swift-ass-renderer
    exactVersion: 1.3.1
  SwiftLibass:
    url: https://github.com/mihai8804858/swift-libass
    exactVersion: 1.4.0
  Nuke:
    url: https://github.com/kean/Nuke
    from: "13.2.0"

targets:
  Auger:
    templates: [ShippableProduct]
    type: application
    platform: tvOS
    sources:
      - path: iosApp
        excludes:
          - "**/*.xcodeproj"
          - "**/*.xcworkspace"
          - "macOS/**"
      - path: Resources
        buildPhase: resources
      # Permission prompt text (docs/i18n.md).
      - path: InfoPlist/tvOS/InfoPlist.xcstrings
      # License and App Store exception shown under Settings > About >
      # Acknowledgements. Bundled from the repository root so the app cannot
      # drift from the published terms.
      - path: ../LICENSE
        buildPhase: resources
      - path: ../APPSTORE-EXCEPTION.md
        buildPhase: resources
    # PRODUCT_BUNDLE_IDENTIFIER and CODE_SIGN_ENTITLEMENTS live in
    # Signing/Auger.xcconfig so local contributors can override them via
    # Signing/Local.xcconfig without dirtying this file.
    configFiles:
      Debug: Signing/Auger.xcconfig
      Release: Signing/Auger.xcconfig
    settings:
      base:
        PRODUCT_NAME: Auger
        INFOPLIST_FILE: iosApp/tvOS-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: TVAppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: "NO"
        SDKROOT: appletvos
        SUPPORTED_PLATFORMS: "appletvos appletvsimulator"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    dependencies:
      - package: AetherEngine
        product: AetherEngine
      - package: SwiftAssRenderer
        product: SwiftAssRenderer
      - package: SwiftLibass
        product: SwiftLibass
      - package: Nuke
        product: Nuke
      - package: Nuke
        product: NukeUI
      - target: AugerTopShelf
        embed: true

  # Top Shelf extension: populates the Apple TV Home Screen with
  # Continue Watching / Next Up rows when the Auger app icon is focused.
  # Shares auth state with the host app via an App Group and shared Keychain
  # access group.
  AugerTopShelf:
    templates: [ShippableProduct]
    type: app-extension
    platform: tvOS
    sources:
      - path: TopShelf
      # Extensions list the string catalog explicitly (docs/i18n.md).
      - path: iosApp/Localizable.xcstrings
      - path: iosApp/Shared
        excludes:
          - "Diagnostics/**"
    configFiles:
      Debug: Signing/AugerTopShelf.xcconfig
      Release: Signing/AugerTopShelf.xcconfig
    settings:
      base:
        PRODUCT_NAME: AugerTopShelf
        INFOPLIST_FILE: TopShelf/Info.plist
        SDKROOT: appletvos
        SUPPORTED_PLATFORMS: "appletvos appletvsimulator"
    dependencies:
      - sdk: TVServices.framework

  # Unit-test bundle for the tvOS Auger app.
  AugerTests:
    type: bundle.unit-test
    platform: tvOS
    sources:
      - path: Tests
        excludes:
          # iOS-only / non-tvOS test files whose symbols compile out on tvOS.
          - "ApplePushRegistrationTests.swift"
          - "DetailPrewarmerTests.swift"
          - "DetailSeedTests.swift"
          - "DetailFrameCommitTests.swift"
          - "DetailDismissalNavigationTests.swift"
          - "HorizontalMediaRailTests.swift"
          - "PlayerSurfaceLayoutTests.swift"
          - "MetricKitCaptureTests.swift"
          - "PairingCoordinatorTests.swift"
          - "SiloControlTests.swift"
          - "OnboardingInvitationTests.swift"
          - "AutoDownloadStatusTests.swift"
          - "TrackpadScrubTests.swift"
          - "CardYearsTests.swift"
          # Non-fixture provenance/tooling files re-added below with no build phase.
          - "Fixtures/ASS/README.md"
          - "Fixtures/ASS/generate-font.py"
          - "Fixtures/ASS/alternate.ass"
      - path: Tests/Fixtures/SettingsContract/SOURCE
        buildPhase: none
      - path: Tests/Fixtures/PlaybackV3/SOURCE
        buildPhase: none
      - path: Tests/Fixtures/BufferingQuality/SOURCE
        buildPhase: none
      - path: Tests/Fixtures/APIv2/SOURCE
        buildPhase: none
      - path: Tests/Fixtures/DiagnosticsContract/SOURCE
        buildPhase: none
      - path: Tests/Fixtures/ASS/README.md
        buildPhase: none
      - path: Tests/Fixtures/ASS/generate-font.py
        buildPhase: none
      - path: Tests/Fixtures/ASS/alternate.ass
        buildPhase: none
    dependencies:
      - target: Auger
    settings:
      base:
        PRODUCT_NAME: AugerTests
        GENERATE_INFOPLIST_FILE: "YES"
        SDKROOT: appletvos
        SUPPORTED_PLATFORMS: "appletvos appletvsimulator"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Auger.app/Auger"
        # Existing test files import `Silo`; module aliasing maps `Silo` to
        # `Auger` for this test bundle so tests compile against the Auger app
        # target without changing app symbol mangling or Info.plist.
        OTHER_SWIFT_FLAGS: "$(inherited) -module-alias Silo=Auger"

schemes:
  Auger:
    build:
      targets:
        Auger: all
        AugerTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AugerTests
    archive:
      config: Release
    analyze:
      config: Debug
    profile:
      config: Release

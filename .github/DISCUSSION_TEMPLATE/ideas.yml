body:
  - type: markdown
    attributes:
      value: |
        An idea is most useful when it explains the problem you hit, with a concrete example, rather than prescribing a solution. One idea per discussion.

        Ideas that need new server or API behavior belong in [silo-server's Ideas](https://github.com/Silo-Server/silo-server/discussions/categories/ideas).
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do on Apple TV, and what stops you today. Give a concrete example.
    validations:
      required: true
  - type: textarea
    id: current-workaround
    attributes:
      label: Current workaround
      description: What you do instead today, or "none".
    validations:
      required: true
  - type: textarea
    id: proposed-behavior
    attributes:
      label: Proposed behavior
      description: What you would like Auger to do. Describe the outcome, not an implementation.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, and why they fall short.

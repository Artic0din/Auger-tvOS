name: Bug report
description: Report something broken in Auger on Apple TV (tvOS)
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Report behavior you reproduced yourself on Apple TV. Keep what you observed separate from any theory about the cause. Redact credentials, tokens, personal data, server addresses, and private media details, and mark each redaction.

        Problems that also happen in the Silo web app usually come from the server and belong in [silo-server](https://github.com/Silo-Server/silo-server/issues/new/choose). Read [CONTRIBUTING.md](https://github.com/Artic0din/Auger-tvOS/blob/main/CONTRIBUTING.md) first.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What did you actually observe? Include how often it happens (for example "3 of 3 attempts") and whether the same item works in the Silo web app.
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: Exact steps you ran, from a stated starting point.
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What should have happened, and where that expectation comes from.
    validations:
      required: true
  - type: input
    id: device-details
    attributes:
      label: Apple TV model and tvOS version
      placeholder: Apple TV 4K (3rd generation), tvOS 26.1
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version and build
      description: "**Settings > Server > About > App Version** in Auger on Apple TV."
      placeholder: "1.0.0 (1)"
    validations:
      required: true
  - type: dropdown
    id: install-source
    attributes:
      label: Installed from
      options:
        - "Built from source"
        - "Sideloaded IPA from GitHub Releases"
        - "TestFlight"
        - "Other"
    validations:
      required: true
  - type: input
    id: server-version
    attributes:
      label: Silo server version
      description: The **Build** value at the bottom of your Silo server's admin sidebar, for example `412 · 1a2b3c4d`.
    validations:
      required: true
  - type: textarea
    id: playback-details
    attributes:
      label: Playback details
      description: "For playback problems. Open **Info and options > Stats** in the player and include the delivery or route, container, video, audio, and dynamic range, plus the subtitle format and your audio setup (TV speakers, soundbar, receiver)."
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or recording
      description: Optional. Drag files here. Crop or blur server addresses, account names, and anything else private first.
  - type: textarea
    id: relevant-logs
    attributes:
      label: Relevant server logs
      description: Optional. Raw lines from your Silo server's **Admin > Logs**, filtered by playback session when you can.
      render: shell
  - type: textarea
    id: technical-notes
    attributes:
      label: Technical notes
      description: Optional suspected root cause or related observations. Keep this separate from what you observed above.
  - type: input
    id: ai-disclosure
    attributes:
      label: AI disclosure
      description: Optional. Note if you used AI to draft or investigate this issue (tool and model), or leave blank.
  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched open and recently closed issues and pull requests, and this is not already reported
          required: true
        - label: I reproduced this myself on the Apple TV and app version above
          required: true

name: Apple tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        scheme: [Silo, SiloTV, SiloMac]
    env:
      # Known failures on main, each tracked by an issue; remove an entry when
      # its issue is fixed.
      #   #57 ImageSizeCapabilityTests, ArtworkURLTests
      #   #58 TVSignInTests
      #   #59 PlayerSurfaceLayoutTests
      SILO_SKIP_TESTS: >-
        ImageSizeCapabilityTests/testResetClearsCapability
        ArtworkURLTests/testDeliveryCapabilityOnIOSUsesV2RouteAndResets
        TVSignInTests/testApprovalCardExplainsEveryWayALookupEnds
        PlayerSurfaceLayoutTests
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select the newest Xcode 27
        run: |
          xcode=$(ls -d /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -1)
          if [ -z "$xcode" ]; then
            echo "::error::No Xcode 27 on this runner image."
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Install XcodeGen (pinned, checksum-verified)
        uses: ./.github/actions/install-xcodegen
        with:
          save-cache: ${{ github.event_name == 'push' }}

      - name: Build and test ${{ matrix.scheme }}
        run: scripts/apple-test.sh "${{ matrix.scheme }}"

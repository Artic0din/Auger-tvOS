name: Sideload IPA Build

# Builds an UNSIGNED tvOS IPA for third-party signing / sideloading.
# This artifact is not installable as-is: re-sign it with your own Apple
# account before sideloading. No signing certs, Match repo, or App Store
# Connect key is used. See docs/release/sideloading.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Marketing version (e.g. 1.0.0)'
        required: true
        type: string

concurrency:
  group: sideload-ipa
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.rel.outputs.tag }}
      build_number: ${{ steps.rel.outputs.build_number }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: rel
        env:
          GH_TOKEN: ${{ github.token }}
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_REF_NAME: ${{ github.ref_name }}
          GH_RUN_NUMBER: ${{ github.run_number }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          V="$(scripts/ci/resolve-marketing-version.sh \
                "$GH_EVENT_NAME" "$GH_REF_NAME" "$INPUT_VERSION")"
          BUILD="$GH_RUN_NUMBER"
          echo "build_number=$BUILD" >> "$GITHUB_OUTPUT"
          TAG="v${V}-build.${BUILD}"
          TITLE="v${V} (Build ${BUILD})"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "$TITLE" \
              --notes "Unsigned tvOS IPA for third-party signing / sideloading. See docs/release/sideloading.md. The Auger-source archive contains the matching source and rebuild instructions." \
              || gh release view "$TAG" >/dev/null
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Releasing as $TAG (build $BUILD)"

  source:
    needs: release
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release-source.yml
    with:
      release_tag: ${{ needs.release.outputs.tag }}

  build:
    needs: [release, source]
    runs-on: xcode-27
    env:
      SILO_CACHE_NAMESPACE: production
      SILO_SOURCE_PACKAGES_PATH: ${{ github.workspace }}/.ci-cache/packages
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select Xcode 27.1
        run: sudo xcode-select -s /Applications/Xcode_27.1.app

      - name: Record device package cache inputs
        id: metadata
        run: python3 scripts/ci/apple-build-metadata.py --root . --device-scheme Auger-device --outputs

      - name: Install XcodeGen (pinned, checksum-verified)
        uses: ./.github/actions/install-xcodegen

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Restore device packages
        id: cache
        continue-on-error: true
        uses: ./.github/actions/cache-spm
        with:
          operation: restore
          root: '.'
          mode: dependencies
          namespace: ${{ env.SILO_CACHE_NAMESPACE }}
          toolchain-key: ${{ steps.metadata.outputs.toolchain_key }}
          lock-key: ${{ steps.metadata.outputs.lock_sha256 }}
          project-key: ${{ steps.metadata.outputs.build_config_sha256 }}-xcodegen2.43.0
          source-sha: ${{ steps.metadata.outputs.source_sha }}
          scheme: Auger-device

      - name: Resolve marketing version
        id: ver
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          V="$(scripts/ci/resolve-marketing-version.sh \
                "$GH_EVENT_NAME" "$GH_REF_NAME" "$INPUT_VERSION")"
          {
            echo "value<<EOF"
            echo "$V"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved marketing version: $V"

      - name: Build unsigned tvOS IPA
        id: archive
        run: bundle exec fastlane ios ipa_tvos_unsigned
        env:
          MARKETING_VERSION: ${{ steps.ver.outputs.value }}
          BUILD_NUMBER: ${{ needs.release.outputs.build_number }}
          SILO_RELEASE_SOURCE_URL: ${{ needs.source.outputs.source_url }}

      - name: Upload tvOS IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Auger-tvOS-unsigned-ipa
          path: build/tvos-unsigned/Auger-unsigned.ipa
          if-no-files-found: error

      - name: Attach tvOS IPA to release
        env:
          GH_TOKEN: ${{ github.token }}
          IPA_PATH: build/tvos-unsigned/Auger-unsigned.ipa
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
        run: gh release upload "$RELEASE_TAG" "$IPA_PATH" --clobber

      - name: Save device packages after successful publication
        if: ${{ success() && steps.archive.outcome == 'success' }}
        continue-on-error: true
        uses: ./.github/actions/cache-spm
        with:
          operation: save
          root: '.'
          mode: dependencies
          namespace: ${{ env.SILO_CACHE_NAMESPACE }}
          toolchain-key: ${{ steps.metadata.outputs.toolchain_key }}
          lock-key: ${{ steps.metadata.outputs.lock_sha256 }}
          project-key: ${{ steps.metadata.outputs.build_config_sha256 }}-xcodegen2.43.0
          source-sha: ${{ steps.metadata.outputs.source_sha }}
          scheme: Auger-device
          save-cache: 'true'
          save-dependencies: 'true'
          spm-cache-hit: ${{ steps.cache.outputs.spm-cache-hit }}
